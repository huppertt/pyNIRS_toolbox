name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      # Keep Qt and matplotlib head-less on the CI runners.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        # Keep optional-dependency tests out of the core matrix; the job below
        # covers Cedalion, while MATLAB comparisons remain local.
        run: pytest --color=yes -m "not requires_cedalion and not requires_matlab"

  cedalion:
    name: Pytest with latest Cedalion and SNIRF (Python 3.11)
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install latest stable Cedalion
        # Cedalion provides the latest compatible snirf (pysnirf2) parser.
        run: pip install git+https://github.com/ibs-lab/cedalion.git@v26.5.1

      - name: Run the test suite without MATLAB comparisons
        run: pytest --color=yes -m "not requires_matlab"
