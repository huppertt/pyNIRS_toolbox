[flake8]
max-line-length = 120
extend-ignore =
    # black/pep8 disagreement on slicing whitespace
    E203,
    # line break before binary operator (conflicts with W504)
    W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    examples/.ipynb_checkpoints
per-file-ignores =
    # package __init__ files deliberately re-export submodules
    __init__.py:F401

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: marks tests that take a long time to run
    requires_cedalion: test needs the optional cedalion dependency
    requires_qt: test needs PySide6 and a usable Qt platform plugin
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
